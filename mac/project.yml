name: MarkdownNotes
options:
  bundleIdPrefix: com.markdownnotes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.markdownnotes.app
    PRODUCT_NAME: M Notes
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MarkdownNotes:
    type: application
    platform: macOS
    sources:
      - path: MarkdownNotes
        excludes:
          - "**/.DS_Store"
          - "Editor"
      - path: MarkdownNotes/Editor
        type: folder
        buildPhase: resources
    info:
      path: MarkdownNotes/Info.plist
      properties:
        CFBundleName: M Notes
        CFBundleDisplayName: M Notes
        CFBundleShortVersionString: "1.0.6"
        CFBundleVersion: "10"
        CFBundleIconName: AppIcon
        NSHumanReadableDescription: "A powerful Markdown editor for macOS"
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        LSApplicationCategoryType: public.app-category.productivity
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSDocumentClass: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleTypeExtensions:
              - md
              - markdown
              - mdown
              - txt
            CFBundleTypeIconSystemFile: NSDocumentIcon
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
        NSAppleEventsUsageDescription: "MarkdownNotes uses Apple Events for automation."
        com.apple.security.app-sandbox: false
