<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", sans-serif; background: #ffffff; }
    @media (prefers-color-scheme: dark) {
      body { background: #181818; color: #ffffff; }
    }
    #titlebar {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: rgba(243, 243, 243, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 12px;
      color: #555;
    }
    @media (prefers-color-scheme: dark) {
      #titlebar { background: rgba(32, 32, 32, 0.85); border-bottom-color: rgba(255, 255, 255, 0.08); color: #aaa; }
    }
    .title-text { font-weight: 600; color: inherit; }
    .toolbar-actions { display: flex; gap: 8px; }
    .btn {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      background: #ffffff;
      color: inherit;
      cursor: pointer;
      font-size: 12px;
    }
    .btn:hover { background: rgba(0, 0, 0, 0.04); }
    @media (prefers-color-scheme: dark) {
      .btn { background: #282828; border-color: rgba(255, 255, 255, 0.15); }
      .btn:hover { background: rgba(255, 255, 255, 0.08); }
    }
    #editor-frame {
      width: 100%;
      height: calc(100% - 36px);
      border: none;
    }
  </style>
</head>
<body>
  <div id="titlebar">
    <div class="toolbar-actions">
      <button class="btn" id="btn-open">打开 (Ctrl+O)</button>
      <button class="btn" id="btn-save">保存 (Ctrl+S)</button>
      <button class="btn" id="btn-new">新建 (Ctrl+N)</button>
    </div>
    <span class="title-text" id="doc-title">M Notes - Untitled.md</span>
    <div class="toolbar-actions">
      <button class="btn" id="btn-theme">切换主题</button>
    </div>
  </div>

  <iframe id="editor-frame" src="editor/editor.html"></iframe>

  <script src="main.js"></script>
</body>
</html>
