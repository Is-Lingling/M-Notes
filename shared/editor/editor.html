<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor</title>

  <!-- KaTeX math rendering -->
  <link rel="stylesheet" href="katex/katex.min.css">

  <!-- highlight.js syntax themes (toggled by dark mode) -->
  <link rel="stylesheet" href="highlight/styles/github.min.css" id="hljs-light-theme">
  <link rel="stylesheet" href="highlight/styles/github-dark.min.css" id="hljs-dark-theme" disabled>

  <!-- Base editor styles (Notes.app theme) -->
  <link rel="stylesheet" href="editor.css" id="base-theme">

  <!-- Bundled built-in themes (instant switching) -->
  <link rel="stylesheet" href="themes.css" id="bundled-themes">

  <!-- Dynamic custom theme (set via editor.setTheme for external themes) -->
  <link rel="stylesheet" href="" id="custom-theme" disabled>
</head>
<body>
  <div id="editor-root"></div>

  <!-- Math -->
  <script src="katex/katex.min.js"></script>

  <!-- Code highlight -->
  <script src="highlight/highlight.min.js"></script>

  <!-- Mermaid is loaded on demand by editor.js when a diagram is rendered. -->

  <!-- Markdown rendering -->
  <script src="markdown-it/markdown-it.min.js"></script>
  <script src="markdown-it/markdown-it-task-lists.min.js"></script>

  <!-- CodeMirror 6 (WYSIWYG engine) -->
  <script src="codemirror/codemirror-bundle.js"></script>

  <!-- Main editor logic -->
  <script src="editor.js"></script>
</body>
</html>
