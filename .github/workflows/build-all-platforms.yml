name: Build Cross-Platform Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-native
    paths:
      - 'windows/**'
      - 'linux/**'
      - 'shared/**'
      - '.github/workflows/build-all-platforms.yml'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (EXE & MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/src-tauri/target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('windows/src-tauri/Cargo.lock', 'windows/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      - name: Install Windows dependencies
        run: |
          cd windows
          npm install

      - name: Build Windows Package
        run: |
          cd windows
          npx tauri build --ignore-version-mismatches

      - name: Collect and Rename Artifacts
        shell: bash
        run: |
          mkdir -p dist-windows
          EXE_FILE=$(find windows/src-tauri/target/release/bundle/nsis -name "*.exe" | head -n 1)
          MSI_FILE=$(find windows/src-tauri/target/release/bundle/msi -name "*.msi" | head -n 1)
          if [ -n "$EXE_FILE" ]; then
            cp "$EXE_FILE" dist-windows/M-Notes-v1.0.0-windows-x64-setup.exe
          fi
          if [ -n "$MSI_FILE" ]; then
            cp "$MSI_FILE" dist-windows/M-Notes-v1.0.0-windows-x64.msi
          fi
          ls -la dist-windows/

      - name: Upload Windows Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in dist-windows/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release v1.0.0..."
              gh release upload v1.0.0 "$f" --clobber
            fi
          done

  build-linux:
    name: Build Linux (DEB & AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linux/src-tauri/target
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('linux/src-tauri/Cargo.lock', 'linux/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-

      - name: Install Linux dependencies
        run: |
          cd linux
          npm install

      - name: Build Linux Package
        run: |
          cd linux
          npx tauri build --ignore-version-mismatches

      - name: Collect and Rename Artifacts
        run: |
          mkdir -p dist-linux
          DEB_FILE=$(find linux/src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          APPIMAGE_FILE=$(find linux/src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" dist-linux/m-notes_1.0.0_amd64.deb
          fi
          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" dist-linux/m-notes_1.0.0_amd64.AppImage
          fi
          ls -la dist-linux/

      - name: Upload Linux Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist-linux/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release v1.0.0..."
              gh release upload v1.0.0 "$f" --clobber
            fi
          done
